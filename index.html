<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mingy's Hands</title>
<meta name="theme-color" content="#1b1f24">
<style>
:root{--bg:#14171b;--card:#1f242b;--line:#2d343d;--fg:#e6e9ee;--dim:#8b96a3;--hp:#d64545;--mp:#3f73d8;--ok:#3fb950;--bad:#c62828}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.35 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:#1b1f24;border-bottom:1px solid var(--line);padding:8px 10px}
h1{font-size:16px;margin:0 0 6px}.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
input,select,button{font:inherit;color:var(--fg);background:#0f1215;border:1px solid var(--line);border-radius:6px;padding:6px 8px}
button{background:#2a3340;cursor:pointer}button.pri{background:#2f6f3e;border-color:#3d8a4f}
#code{flex:1;min-width:0;font-family:ui-monospace,monospace;letter-spacing:.5px}
.st{color:var(--dim);font-size:12px;margin-top:4px}
main{padding:8px;display:grid;gap:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.card.gone{opacity:.45;filter:grayscale(1)}.card.att{border-color:var(--bad);box-shadow:0 0 0 2px var(--bad) inset;animation:pulse 1s infinite}
@keyframes pulse{50%{background:#3a1c1c}}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.nm{font-weight:700;font-size:15px}.on{color:var(--ok);font-size:12px}.off{color:var(--dim);font-size:12px}
.alarm{background:var(--bad);color:#fff;border-radius:5px;padding:1px 6px;font-size:12px;font-weight:700}
.bars{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:6px 0 4px}
.bar{position:relative;height:16px;background:#0f1215;border-radius:4px;overflow:hidden;font-size:11px}
.bar i{position:absolute;inset:0;width:0}.bar span{position:relative;padding-left:5px;line-height:16px}
.kv{display:flex;flex-wrap:wrap;gap:4px 12px;color:var(--dim);font-size:12px}.kv b{color:var(--fg);font-weight:600}
details{margin-top:5px}summary{cursor:pointer;color:var(--dim);font-size:12px}
.chat,.near{font-size:12px;margin:4px 0 0;padding:0;list-style:none;max-height:140px;overflow:auto}
.chat li{padding:1px 0;border-bottom:1px dashed #2a3038}.pm{color:#e0a3ff}.chn{display:inline-block;font-size:10px;padding:0 4px;margin-right:3px;border-radius:3px;background:#2a3340;color:#aab4c0}.pm .chn{background:#5b2a73;color:#fff}
.near li{display:flex;justify-content:space-between}.p{color:#ffd54f}.m{color:#ff8a80}.n{color:#9ccc65}
canvas{width:100%;height:170px;background:#0c0e10;border-radius:8px;border:1px solid var(--line);display:block}
#act .row>*{flex:1}#act input,#act select{min-width:0}
.ack{font-size:12px;color:var(--dim)}.warn{color:#ffb74d}.small{font-size:11px;color:var(--dim)}
</style></head><body>
<header>
  <h1>Mingy's Hands</h1>
  <div class="row"><input id="code" placeholder="MH-XXXX-XXXX-XXXX-XXXX" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false">
  <button id="go" class="pri">Connect</button></div>
  <div class="row st"><span id="st">Enter your team pairing code.</span>
  <label class="small"><input type="checkbox" id="snd"> alarm sound/vibrate</label></div>
</header>
<main>
  <canvas id="map" width="760" height="340"></canvas>
  <div id="list"></div>
  <div class="card" id="act">
    <div class="top"><span class="nm">Actions</span><span class="small" id="pwst">read-only</span></div>
    <div class="row" style="margin-top:6px"><input id="pw" type="password" placeholder="Master password" autocomplete="current-password">
      <button id="pwset">Unlock</button></div>
    <div class="row small"><label><input type="checkbox" id="pwrem"> remember on this phone (stores a derived key, not the password)</label></div>
    <div class="row" style="margin-top:6px"><select id="as"></select><select id="ch"><option value="default">Default chat</option><option value="pm">Private to…</option></select></div>
    <div class="row" style="margin-top:6px"><input id="to" placeholder="Player name (private)" style="display:none"></div>
    <div class="row" style="margin-top:6px"><input id="txt" placeholder="Message" maxlength="250"><button id="send" class="pri" style="flex:0 0 auto">Send</button></div>
    <div class="ack" id="ack"></div>
  </div>
  <div class="small" style="text-align:center;padding:4px 0 16px">Read-only with the pairing code. Actions need the master password set in each copy's Sharing tab.</div>
</main>
<script>
'use strict';
// ?nontfy = test the ntfy-free join (as when ntfy.sh answers HTTP 429)
const NO_NTFY=/[?&]nontfy\b/.test(location.search);
const NTFY='https://ntfy.sh', PIPE='https://ppng.io';
const ALPH='0123456789ABCDEFGHJKMNPQRSTVWXYZ', te=new TextEncoder(), td=new TextDecoder();
const $=id=>document.getElementById(id), S=window.crypto&&crypto.subtle;
// storage can be blocked (private window / strict privacy settings): never let that stop Connect
const LS={get:k=>{try{return LS.get(k)}catch(e){return null}},set:(k,v)=>{try{LS.set(k,v)}catch(e){}},del:k=>{try{LS.del(k)}catch(e){}}};
const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
const cat=(...a)=>{let n=a.reduce((s,x)=>s+x.length,0),o=new Uint8Array(n),i=0;for(const x of a){o.set(x,i);i+=x.length}return o};
const b64u=b=>btoa(String.fromCharCode(...b)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const unb64u=s=>Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')+'='.repeat((4-s.length%4)%4)),c=>c.charCodeAt(0));
function norm(c){let s=(c||'').normalize('NFKC').toUpperCase().replace(/[^0-9A-Z]/g,'');if(s.length==18&&s.startsWith('MH'))s=s.slice(2);
  s=s.replace(/O/g,'0').replace(/[IL]/g,'1');return s.length==16&&[...s].every(ch=>ALPH.includes(ch))?s:''}
async function hmac(key,data){const k=await S.importKey('raw',key,{name:'HMAC',hash:'SHA-256'},false,['sign']);return new Uint8Array(await S.sign('HMAC',k,data))}
async function sha(d){return new Uint8Array(await S.digest('SHA-256',d))}
async function pbkdf2(pw,salt,bits){const k=await S.importKey('raw',pw,'PBKDF2',false,['deriveBits']);
  return new Uint8Array(await S.deriveBits({name:'PBKDF2',hash:'SHA-256',salt,iterations:100000},k,bits))}
let K=null;   // {code,enc,mac,group}
async function derive(code){const dk=await pbkdf2(te.encode(code),te.encode('MingysHands-pair-v2'),512);
  const enc=dk.slice(0,32),mac=dk.slice(32);return {code,enc,mac,group:hex(await sha(cat(te.encode('group|'),mac))).slice(0,24)}}
async function lane(kind,l){return 'mh2'+hex(await sha(cat(te.encode(kind+'|'+l+'|'),K.mac))).slice(0,40)}
async function stream(nonce,n){let out=new Uint8Array(0),ctr=0;while(out.length<n){const c=new Uint8Array(4);new DataView(c.buffer).setUint32(0,ctr++);
  out=cat(out,await hmac(K.enc,cat(nonce,c)))}return out.slice(0,n)}
async function tag(nonce,c){return hmac(K.mac,cat(te.encode('MH2|'+K.group),nonce,c))}
async function seal(obj){const pt=te.encode(JSON.stringify(obj)),nonce=crypto.getRandomValues(new Uint8Array(16)),ks=await stream(nonce,pt.length);
  const c=pt.map((x,i)=>x^ks[i]);return {v:2,n:b64u(nonce),c:b64u(c),m:b64u(await tag(nonce,c))}}
async function openEnv(env){if(!env||env.v!==2)throw 'ver';const nonce=unb64u(env.n),c=unb64u(env.c),m=unb64u(env.m);
  const t=await tag(nonce,c);if(nonce.length!=16||t.length!=m.length||t.some((x,i)=>x!==m[i]))throw 'sig';
  const ks=await stream(nonce,c.length);return JSON.parse(td.decode(c.map((x,i)=>x^ks[i])))}
// ---- live state ----
const newId=()=>'web'+hex(crypto.getRandomValues(new Uint8Array(5)))+'.'+hex(crypto.getRandomValues(new Uint8Array(2)));
let ME=newId(), AC=new AbortController(), helloT=null, rosterOk=0, rosterErr='';
const ONLINE_MS=90000, DROP_MS=120000, STALL_MS=12000;   // online while data < 90 s old (any path), gone after 2 min (client rule)
// age = time since we got it + how old it already was when it arrived (relayed lines); 30 s clock-skew tolerance
function age(d,now){const lag=d._seen-d._t;return Math.max(0,now-d._seen+(lag>30000?lag:0))}
let members={}, pipes={}, gen=0, sel=null, MK=null, lastAck={}, rosterTopic='', cmdTopic='';
async function* lines(resp){const rd=resp.body.getReader();let buf='';for(;;){const {value,done}=await rd.read();if(done)break;
  buf+=td.decode(value,{stream:true});let i;while((i=buf.indexOf('\n'))>=0){const l=buf.slice(0,i).trim();buf=buf.slice(i+1);if(l)yield l}}if(buf.trim())yield buf.trim()}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function hello(bye){if(NO_NTFY)return {ok:true,status:200};const line=JSON.stringify(Object.assign({sid:ME,hello:3,view:1,env:await seal({name:'web',t:Date.now()/1000,seq:0})},bye?{bye:1}:{}));
  return fetch(NTFY+'/'+rosterTopic,{method:'POST',body:line,keepalive:!!bye})}
const bySid={};
let rlWait=0;const RL='ntfy.sh is rate-limiting this network (HTTP 429, shared with your other PCs/VMs)';
async function roster(g){if(NO_NTFY){rosterErr='ntfy off (test)';return}while(g===gen){try{const r=await fetch(NTFY+'/'+rosterTopic+'/json?since=45m',{signal:AC.signal});if(r.status===429)throw 429;if(!r.ok)throw 'ntfy '+r.status;rosterOk=1;rosterErr='';rlWait=0;
  for await(const l of lines(r)){if(g!==gen)return;let ev;try{ev=JSON.parse(l)}catch(e){continue}
    if(ev.event!=='message'||!ev.message)continue;let m;try{m=JSON.parse(ev.message)}catch(e){continue}
    if(!m.hello||m.view||!m.sid||m.sid===ME)continue;let d;try{d=await openEnv(m.env)}catch(e){continue}
    if(Date.now()/1000-(d.t||0)>2700)continue;
    if(m.bye){if(pipes[m.sid])pipes[m.sid].stop=1;delete pipes[m.sid];continue}
    const nm=d.name||m.sid,old=bySid[nm];if(old&&old.sid!==m.sid){if(old.t>(d.t||0))continue;if(pipes[old.sid])pipes[old.sid].stop=1;delete pipes[old.sid]}
    bySid[nm]={sid:m.sid,t:d.t||0};
    if(!pipes[m.sid]){pipes[m.sid]={};pipe(g,m.sid)}}}catch(e){if(g!==gen)return;rosterOk=0;
    if(e===429){rlWait=Math.min(600000,(rlWait||30000)*2);rosterErr=RL+' – direct join in use, ntfy retry in '+Math.round(rlWait/1000)+' s';await sleep(rlWait);continue}
    rosterErr=String(e&&e.message||e)}await sleep(3000)}}
// ntfy-free join (Jan 22:16): every copy offers its hello on one team 'bell' path; we take one, ring that copy's
// 'door' with our viewer hello; it streams to us and tells the other members (they open their streams too)
let doorOk=0,doorT=0;const sidOf={};
async function ringDoor(sid){const p=await lane('pipe3','door|'+sid),ac=new AbortController(),t=setTimeout(()=>ac.abort(),20000);
  try{const hl=JSON.stringify({sid:ME,hello:3,view:1,env:await seal({name:'web',t:Date.now()/1000,seq:0})});
    const r=await fetch(PIPE+'/'+p,{method:'POST',body:hl+'\n',signal:ac.signal});if(r.ok){doorOk=1;doorT=Date.now()}return r.ok}catch(e){return false}finally{clearTimeout(t)}}
async function doorJoin(g){const bell=await lane('pipe3','webjoin');let fails=0;
  while(g===gen){const live=Object.keys(members).filter(n=>age(members[n],Date.now())<ONLINE_MS).length;
    if(live&&Date.now()-doorT<240000){await sleep(5000);continue}
    if(live){for(const n in sidOf)await ringDoor(sidOf[n]);doorT=Date.now();continue}      // re-announce every 4 min
    const ac=new AbortController(),kill=()=>ac.abort(),t=setTimeout(kill,30000);AC.signal.addEventListener('abort',kill);
    try{const r=await fetch(PIPE+'/'+bell,{signal:ac.signal});if(!r.ok)throw r.status;const txt=await r.text();
      for(const l of txt.split('\n')){let m;try{m=JSON.parse(l)}catch(e){continue}if(!m.hello||m.view||!m.sid)continue;
        try{await openEnv(m.env)}catch(e){continue}if(g!==gen)return;
        if(!pipes[m.sid]){pipes[m.sid]={};pipe(g,m.sid)}await ringDoor(m.sid);fails=0}}
    catch(e){fails++}finally{clearTimeout(t);AC.signal.removeEventListener('abort',kill)}
    await sleep(fails?Math.min(15000,1000*fails):1000)}}
async function pipe(g,sid){const path=await lane('pipe3',sid+'>'+ME);let fails=0;
  while(g===gen&&pipes[sid]&&!pipes[sid].stop){
    // a stream that stops delivering (stalled transfer, phone network switch) is aborted after 12 s and re-opened:
    // members send every <= 4 s, and fetch() itself never times out a silent body
    const ac=new AbortController(),kill=()=>ac.abort();AC.signal.addEventListener('abort',kill);let last=Date.now();
    const wd=setInterval(()=>{if(Date.now()-last>STALL_MS){ac.abort();pipes[sid]&&(pipes[sid].stalls=(pipes[sid].stalls||0)+1)}},2000);
    try{const r=await fetch(PIPE+'/'+path,{signal:ac.signal});if(!r.ok)throw r.status;last=Date.now();
    for await(const l of lines(r)){last=Date.now();if(g!==gen)return;let m;try{m=JSON.parse(l)}catch(e){continue}
      if(m.hello||!m.env||m.cmd)continue;try{const d=await openEnv(m.env);if(!d.name)continue;
        if(m.sid){sidOf[d.name]=m.sid;if(!pipes[m.sid]){pipes[m.sid]={};pipe(g,m.sid)}}const o=members[d.name];
        if(o&&o.seq>=d.seq&&o.t>=d.t)continue;d._t=(+d.t||0)*1000;d._seen=Date.now();
        if(d._seen-d._t>DROP_MS)continue;   /* relayed old line: member is not online */members[d.name]=d;onAck(d);dirty=1}catch(e){}}fails=0}
  catch(e){fails++}finally{clearInterval(wd);AC.signal.removeEventListener('abort',kill)}
  await sleep(fails?Math.min(8000,500*2**fails):300)}}
// ---- UI ----
let dirty=1;const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function ago(ms){const s=Math.round(ms/1000);return s<60?s+' s':s<3600?Math.round(s/60)+' min':(s/3600).toFixed(1)+' h'}
function bar(v,m,c,l){const p=m?Math.max(0,Math.min(100,100*v/m)):0;return `<div class="bar"><i style="width:${p}%;background:${c}"></i><span>${l} ${v??'–'}/${m??'–'}</span></div>`}
let beepT=0;function alarm(){if(!$('snd').checked||Date.now()-beepT<4000)return;beepT=Date.now();try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}
  try{const a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator();o.frequency.value=880;o.connect(a.destination);o.start();o.stop(a.currentTime+.25)}catch(e){}}
// '[pm] ' = true private message, '[Trade] ' / '[Game Chat] ' = that channel, no tag = Default
function chatLi(c){const m=/^\[([^\]]{1,24})\] ([\s\S]*)$/.exec(c);if(!m)return `<li><span class="chn">Default</span> ${esc(c)}</li>`;
  return m[1]==='pm'?`<li class="pm"><span class="chn">✉ PM</span> ${esc(m[2])}</li>`:`<li><span class="chn">${esc(m[1])}</span> ${esc(m[2])}</li>`}
function render(){const now=Date.now();let names;let h='',anyAtt=false;
  for(const n of Object.keys(members))if(age(members[n],now)>DROP_MS)delete members[n];names=Object.keys(members).sort();
  for(const n of names){const d=members[n],on=age(d,now)<ONLINE_MS,att=on&&d.att;anyAtt=anyAtt||att;
    h+=`<div class="card${att?' att':''}${on?'':' gone'}" data-n="${esc(n)}"><div class="top"><span class="nm">${esc(n)}</span>
    ${att?'<span class="alarm">BEING ATTACKED</span>':''}<span class="${on?'on':'off'}">${on?(age(d,now)<5000?'online':'online · updated '+ago(age(d,now))+' ago'):'offline · last seen '+ago(age(d,now))+' ago'}</span></div>
    <div class="bars">${bar(d.hp,d.maxhp,'var(--hp)','HP')}${bar(d.mp,d.maxmp,'var(--mp)','MP')}</div>
    <div class="kv"><span>lvl <b>${d.level??'–'}</b></span><span>cap <b>${d.cap??'–'}</b></span><span>pos <b>${d.x},${d.y},${d.z}</b></span>
    <span>${esc(d.hunting?(d.mode||'hunting'):'paused')}</span>${d.target?`<span>target <b>${esc(d.target)}</b></span>`:''}</div>
    <details${sel===n?' open':''}><summary>Nearby (${(d.near||[]).length}) · chat (${(d.chat||[]).length})</summary>
    <ul class="near">${(d.near||[]).map(e=>`<li><span class="${e[1]}">${esc(e[0])}</span><span>${e[2]>=0?'+':''}${e[2]},${e[3]>=0?'+':''}${e[3]} · ${e[4]}%</span></li>`).join('')||'<li class="small">nobody on screen</li>'}</ul>
    <ul class="chat">${(d.chat||[]).map(chatLi).join('')||'<li class="small">no recent chat</li>'}</ul></details></div>`}
  $('list').innerHTML=h||'<div class="card small">Waiting for team members… (they appear when a copy with this code is online)</div>';
  if(anyAtt)alarm();
  const as=$('as'),cur=as.value,opts=names.filter(n=>age(members[n],now)<ONLINE_MS);
  if(as.dataset.k!==opts.join('|')){as.innerHTML=opts.map(n=>`<option>${esc(n)}</option>`).join('')||'<option value="">(nobody online)</option>';as.dataset.k=opts.join('|');if(opts.includes(cur))as.value=cur}
  drawMap();const on=opts.length,warn=rosterErr?' · '+rosterErr:'';$('st').textContent=!K?(connErr||'Enter your team pairing code and press Connect.'):
    on?`Connected${rosterOk?'':' (direct join)'} · ${on} online${names.length>on?' · '+(names.length-on)+' offline':''}${rosterOk?'':warn}`:
    rosterOk?`Connected · waiting for team members (${Object.keys(pipes).length} announced)`:
    (rosterErr?'Connecting without ntfy… ('+rosterErr+')':'Connecting…')+(doorOk?' · a member answered':' · looking for a running copy (it must be online with this code)');
  $('st').className=rosterErr&&!on?'warn':''}
$('list').addEventListener('click',e=>{const c=e.target.closest('.card');if(c&&e.target.tagName!=='SUMMARY'){sel=c.dataset.n;dirty=1}});
$('list').addEventListener('toggle',e=>{const c=e.target.closest('.card');if(c&&e.target.open)sel=c.dataset.n},true);
function drawMap(){const cv=$('map'),g=cv.getContext('2d'),W=cv.width,H=cv.height;g.fillStyle='#0c0e10';g.fillRect(0,0,W,H);
  const now=Date.now(),on=Object.values(members).filter(d=>age(d,now)<ONLINE_MS&&d.x!=null);if(!on.length){g.fillStyle='#556';g.font='16px sans-serif';g.fillText('no positions yet',12,26);return}
  const c=members[sel]&&members[sel].x!=null?members[sel]:on[0];const same=on.filter(d=>d.z===c.z);
  let span=12;for(const d of same)span=Math.max(span,Math.abs(d.x-c.x)*2+6,Math.abs(d.y-c.y)*2*W/H+6);const ts=Math.min(28,W/span);
  g.strokeStyle='#1c2229';for(let x=W/2%ts;x<W;x+=ts){g.beginPath();g.moveTo(x,0);g.lineTo(x,H);g.stroke()}for(let y=H/2%ts;y<H;y+=ts){g.beginPath();g.moveTo(0,y);g.lineTo(W,y);g.stroke()}
  const P=(dx,dy)=>[W/2+dx*ts,H/2+dy*ts];
  for(const e of c.near||[]){const [x,y]=P(e[2],e[3]);g.fillStyle=e[1]==='p'?'#ffd54f':e[1]==='m'?'#ff5252':'#9ccc65';g.fillRect(x-ts*.3,y-ts*.3,ts*.6,ts*.6)}
  g.font='bold 13px sans-serif';for(const d of same){const [x,y]=P(d.x-c.x,d.y-c.y);g.fillStyle=d.att?'#ff1744':'#40c4ff';g.beginPath();g.arc(x,y,Math.max(5,ts*.4),0,7);g.fill();
    g.fillStyle='#fff';g.fillText(d.name,x+8,y-8)}
  g.fillStyle='#8b96a3';g.font='12px sans-serif';g.fillText(`${c.name} ${c.x},${c.y} floor ${c.z} · ${on.length-same.length} on other floors`,8,H-8)}
setInterval(()=>{render()},1000);
// ---- actions ----
async function masterKey(pw){return hex(await pbkdf2(te.encode(pw),te.encode('MingysHands-master-v1|'+K.code),256))}
function canon(c){return ['MH-CMD1',c.op,c.target,c.channel,c.to,c.text,String(c.ts),c.nonce].join('\n')}
$('ch').onchange=()=>{$('to').style.display=$('ch').value==='pm'?'':'none'};
$('pwset').onclick=async()=>{if(!K)return;const pw=$('pw').value;$('pw').value='';MK=pw?await masterKey(pw):null;
  if(MK&&$('pwrem').checked)LS.set('mh_mk_'+K.code,MK);if(!MK)LS.del('mh_mk_'+K.code);pwst()};
function pwst(){$('pwst').textContent=MK?'unlocked (only copies with the same master password obey)':'read-only'}
function onAck(d){for(const n in lastAck){const a=lastAck[n];if(d.name===a.t&&d.ack&&d.ack.startsWith(a.nonce)){$('ack').textContent=`${a.t}: ${d.ack.slice(a.nonce.length+1)}`;delete lastAck[n]}}}
$('send').onclick=async()=>{if(!K)return;if(!MK){$('ack').textContent='Unlock with the master password first.';return}
  const t=$('as').value,text=$('txt').value.trim().replace(/\s+/g,' '),ch=$('ch').value,to=ch==='pm'?$('to').value.trim():'';
  if(!t||!text){$('ack').textContent='Pick a member and type a message.';return}if(ch==='pm'&&!to){$('ack').textContent='Type the player name.';return}
  const c={op:'chat',target:t,channel:ch,to,text,ts:Math.floor(Date.now()/1000),nonce:hex(crypto.getRandomValues(new Uint8Array(8)))};
  c.sig=hex(await hmac(Uint8Array.from(MK.match(/../g),h=>parseInt(h,16)),te.encode(canon(c))));
  const body=JSON.stringify({cmd:1,env:await seal(c)})+'\n';lastAck[c.nonce]={t,nonce:c.nonce};$('txt').value='';
  // Jan 22:13 (HTTP 429): commands go straight to the member's own pipe from this page (no ntfy); any other
  // member relays them over the team mesh; ntfy only as the very last try
  const sids=[sidOf[t],bySid[t]&&bySid[t].sid].filter(Boolean),others=Object.values(sidOf).filter(x=>!sids.includes(x));
  const order=[...new Set([...sids,...others])];let ok=false,err='';
  for(let a=0;a<3&&!ok;a++){if(a){$('ack').textContent=`Retrying (${a+1}/3)…`;await sleep(1500*2**a)}
    for(const sid of order){const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),12000);
      try{const r=await fetch(PIPE+'/'+await lane('pipe3',ME+'>'+sid),{method:'POST',body,signal:ac.signal});if(r.ok){ok=true;break}err='pipe '+r.status}
      catch(e){err=e.name==='AbortError'?'no answer from the copy (is it running this build?)':String(e)}finally{clearTimeout(tm)}}}
  if(!ok){try{const r=await fetch(NTFY+'/'+cmdTopic,{method:'POST',body});if(r.status===429)throw RL;if(!r.ok)throw 'ntfy '+r.status;ok=true}catch(e){err=err?err+'; '+e:String(e)}}
  $('ack').textContent=ok?`Sent to ${t} – waiting for its answer…`:'Could not send: '+(err||'no member reachable')+' – try again in a minute.'};
// ---- connect ----
let connErr='';
async function connect(){try{await connect2()}catch(e){K=null;connErr='Could not connect: '+(e&&e.message||e)+(window.isSecureContext&&crypto.subtle?'':' (this browser blocks WebCrypto here – open the https:// link)');render()}}
async function connect2(){connErr='';$('st').textContent='Connecting…';const code=norm($('code').value);if(!code){K=null;connErr=$('st').textContent='That code looks wrong: it needs 16 letters/digits like MH-XXXX-XXXX-XXXX-XXXX (got '+$('code').value.replace(/[^0-9A-Za-z]/g,'').length+').';return}
  $('code').value='MH-'+code.match(/..../g).join('-');LS.set('mh_code',$('code').value);
  if(K){try{await hello(true)}catch(e){}}       // tell the copies the old viewer is gone
  AC.abort();AC=new AbortController();if(helloT)clearInterval(helloT);ME=newId();   // fresh id = fresh streams (ppng: 1 receiver per path)
  gen++;const g=gen;members={};pipes={};for(const k in bySid)delete bySid[k];rosterOk=0;rosterErr='';K=null;render();$('st').textContent='Connecting…';
  K=await derive(code);if(g!==gen)return;rosterTopic=await lane('ntfy','roster');cmdTopic=await lane('ntfy','cmd');
  MK=LS.get('mh_mk_'+code);pwst();roster(g);doorJoin(g);render();
  try{const r=await hello();if(r.status===429)rosterErr=RL;else if(!r.ok)rosterErr='announce failed ('+r.status+')'}catch(e){rosterErr='ntfy unreachable ('+e+')'}
  helloT=setInterval(()=>{if(g===gen)hello().catch(()=>{})},600000)}
addEventListener('pagehide',()=>{if(K)hello(true).catch(()=>{})});
// the code is never in this public page: it comes from the link (#MH-..., the part after # is never sent
// to any server), from this phone's memory, or is typed in
$('go').onclick=connect;$('code').addEventListener('keydown',e=>{if(e.key==='Enter')connect()});const fromLink=decodeURIComponent(location.hash.slice(1));
$('code').value=norm(fromLink)?fromLink:(LS.get('mh_code')||'');
if(norm(fromLink)){history.replaceState(null,'',location.pathname+location.search)}
if($('code').value)connect();
